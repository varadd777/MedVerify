
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medverify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medverify
  template:
    metadata:
      labels:
        app: medverify
    spec:
      containers:
        - name: medverify
          image: ghcr.io/jashkhant185-png/medverify:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
